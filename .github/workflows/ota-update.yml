name: OTA Update

on:
  push:
    branches:
      - development
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update channel (development/staging)'
        required: true
        default: 'development'
      message:
        description: 'Update message'
        required: true

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "channel=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
            echo "message=${{ github.event.inputs.message }}" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "channel=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "message=Update from commit ${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Update
        run: eas update --branch ${{ steps.branch.outputs.channel }} --message "${{ steps.branch.outputs.message }}"
